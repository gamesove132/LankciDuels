# GitHub Actions Build & CI Workflow
# Збережіть цей файл за шляхом: .github/workflows/build.yml

name: CI Build & Test Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Дозволяє вручну запускати збірку з веб-інтерфейсу GitHub

jobs:
  # 1. Збірка та тестування Node.js / JavaScript / TypeScript
  build-node:
    name: Node.js Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build project
        run: npm run build --if-present

      - name: Save Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.node-version }}
          path: dist/ # Вкажіть вашу папку збірки (наприклад, build/ або .next/)
          retention-days: 7

  # 2. Перевірка Python коду
  build-python:
    name: Python Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint & Test
        run: |
          pip install flake8 pytest
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest || echo "No tests configured"

  # 3. Збірка Docker-образу
  build-docker:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [build-node]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: my-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
