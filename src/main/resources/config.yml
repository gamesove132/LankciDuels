# =====================================================================
#  LankciDuels — головний конфігураційний файл
#  Кольори: & коди (&c, &a...) та HEX у форматі &#RRGGBB
# =====================================================================

# Назва плагіна, яка використовується у внутрішніх службових повідомленнях.
plugin-name: "LankciDuels"

# Мова повідомлень за замовчуванням (інформаційно, всі тексти нижче в messages)
language: "uk"

# Показувати додаткові технічні повідомлення в консолі
debug: false

# =====================================================================
#  STORAGE / БАЗА ДАНИХ
# =====================================================================
database:
  # На разі підтримується лише sqlite, щоб не залежати від зовнішнього MySQL
  type: sqlite
  file: "data.db"

# =====================================================================
#  СУМІСНІСТЬ З MULTIVERSE-CORE / MULTIVERSE-INVENTORIES
# =====================================================================
# Коли lobby та арена знаходяться в різних world group Multiverse-Inventories,
# MV-Inventories перемикає інвентар гравця у відповідь на PlayerChangedWorldEvent,
# який спрацьовує як частина teleport(). Якщо LankciDuels застосовує kit або
# відновлює знімок інвентаря в тому ж таті, MV-Inventories може перезаписати
# це своїм груповим профілем.
#
# Щоб уникнути конфлікту, LankciDuels ЗАВЖДИ спочатку виконує teleport, а вже
# потім, через "world-change-delay-ticks" тіків (за замовчуванням 1 тік -
# наступний ігровий такт після того, як усі плагіни, включно з
# Multiverse-Inventories, обробили PlayerChangedWorldEvent), застосовує kit
# (на старті дуелі) або відновлює знімок інвентаря (по завершенні дуелі).
# Це гарантує, що LankciDuels завжди має останнє слово над інвентарем гравця.
#
# Якщо на вашому сервері використовуються особливо "важкі" інтеграції
# world-group (наприклад MV-Inventories + додаткові слухачі, що виконують
# власні асинхронні операції), можна збільшити затримку до 2-3 тіків.
compatibility:
  world-change-delay-ticks: 1

# =====================================================================
#  ЛОББІ
# =====================================================================
# Встановлюється командою /dueladmin setlobby
lobby:
  world: "world"
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# =====================================================================
#  ВИКЛИКИ НА ДУЕЛЬ
# =====================================================================
request:
  # Скільки секунд гравець повинен чекати між двома викликами (антиспам)
  cooldown-seconds: 5
  # Скільки секунд виклик залишається дійсним, перш ніж він "згорить"
  expire-seconds: 30
  # Максимальна кількість одночасних вихідних викликів від одного гравця
  max-pending-per-player: 3

# =====================================================================
#  COUNTDOWN ПЕРЕД СТАРТОМ
# =====================================================================
countdown:
  seconds: 3
  # Заборонити рух під час відліку
  freeze-movement: true
  # Заборонити pvp/шкоду під час відліку
  disable-damage: true
  # Заблокувати команди під час відліку (крім тих, що в командному вайтлисті нижче)
  block-commands: true

# =====================================================================
#  TIMEOUT ДУЕЛІ (якщо бій триває занадто довго)
# =====================================================================
timeout:
  enabled: true
  seconds: 300
  # Що робити при таймауті: draw (нічия, нічого не рахується) або end_current_hp (перемагає гравець з більшим здоров'ям)
  action: "draw"

# =====================================================================
#  ЗАХИСТ ПІД ЧАС ДУЕЛІ
# =====================================================================
protection:
  block-teleport: true
  block-spawn: true
  block-home: true
  block-warp: true
  block-tpa: true
  block-world-change: true
  # Забороняти стороннім гравцям заходити в радіус арени під час бою
  protect-arena-radius: true
  arena-radius: 15
  # Команди, які повністю заблоковані для гравців під час дуелі (без урахування "/")
  blocked-commands:
    - "spawn"
    - "home"
    - "warp"
    - "tpa"
    - "tpaccept"
    - "back"

# =====================================================================
#  ІНВЕНТАР
# =====================================================================
inventory:
  save-inventory: true
  save-armor: true
  save-offhand: true
  save-experience: true
  save-food: true
  save-health: true
  # Очистити інвентар гравця перед видачею kit-у
  clear-before-kit: true
  # Якщо сервер впав під час дуелі — при наступному вході гравцю автоматично
  # повертається збережений інвентар (дані читаються з playerdata/*.yml)
  restore-on-rejoin: true

# =====================================================================
#  QUIT / DISCONNECT
# =====================================================================
quit:
  enabled: true
  opponent_wins: true

# =====================================================================
#  СТАТИСТИКА
# =====================================================================
stats:
  enabled: true
  track-kills: true
  track-deaths: true
  track-wins: true
  track-losses: true
  track-played: true
  track-winstreak: true
  leaderboard-size: 10

# =====================================================================
#  РЕЙТИНГ (ELO), окремий для кожного kit-режиму
# =====================================================================
rating:
  enabled: true
  starting: 1000
  win:
    amount: 25
  loss:
    amount: 20

# =====================================================================
#  НАГОРОДИ
# =====================================================================
rewards:
  enabled: true
  win:
    commands:
      - "eco give %player% 100"
  loss:
    commands: []

# =====================================================================
#  СТАВКИ
# =====================================================================
betting:
  enabled: false
  minimum: 100
  maximum: 10000

# =====================================================================
#  TITLE / SUBTITLE ПРИ ЗАВЕРШЕННІ
# =====================================================================
titles:
  win:
    title: "&a&lПЕРЕМОГА"
    subtitle: "&fВи перемогли &e%opponent%&f!"
    fade-in: 10
    stay: 60
    fade-out: 10
  lose:
    title: "&c&lПОРАЗКА"
    subtitle: "&fВи програли &e%opponent%&f!"
    fade-in: 10
    stay: 60
    fade-out: 10
  draw:
    title: "&e&lНІЧИЯ"
    subtitle: "&fБій закінчився внічию"
    fade-in: 10
    stay: 60
    fade-out: 10

# =====================================================================
#  ЗВУКИ (валідне ім'я enum org.bukkit.Sound; якщо звук некоректний —
#  плагін просто пропустить його без падіння)
# =====================================================================
sounds:
  invite: "ENTITY_EXPERIENCE_ORB_PICKUP"
  accept: "ENTITY_PLAYER_LEVELUP"
  deny: "ENTITY_VILLAGER_NO"
  countdown: "BLOCK_NOTE_BLOCK_PLING"
  start: "ENTITY_ENDER_DRAGON_GROWL"
  win: "UI_TOAST_CHALLENGE_COMPLETE"
  lose: "ENTITY_VILLAGER_NO"

# =====================================================================
#  GUI ВИБОРУ РЕЖИМУ (/duel <player> відкриває це меню)
# =====================================================================
gui:
  mode-select:
    title: "&8Виберіть режим дуелі"
    rows: 3
    # Предмет, яким заповнюються порожні слоти (декор). material: AIR щоб вимкнути.
    filler:
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
      slot-all-empty: true
    # Предмет для скасування виклику
    cancel-item:
      material: "BARRIER"
      name: "&cСкасувати"
      lore:
        - "&7Натисніть, щоб закрити меню"
      slot: 22

# =====================================================================
#  PERMISSIONS (довідково; реальні default-и задані в plugin.yml)
# =====================================================================
permissions:
  use: "lankciduels.use"
  duel: "lankciduels.duel"
  stats: "lankciduels.stats"
  admin: "lankciduels.admin"
  admin-reload: "lankciduels.admin.reload"
  admin-arena: "lankciduels.admin.arena"
  admin-forcestop: "lankciduels.admin.forcestop"

